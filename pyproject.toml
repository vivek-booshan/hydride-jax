[project]
name = "hydride"
version = "1.2.3"
authors = [
    {name = "The 'Hydride' contributors"},
    {name = "Jacob Anter"},
    {name = "Patrick Kunzmann"}
]
description = "Adding hydrogen atoms to molecular models"
readme = "README.rst"
requires-python = ">=3.10"
license = {file = "LICENSE.rst"}
dependencies = [
    "biotite >= 0.40",
    "numpy >= 1.25",
    "jax >= 0.4.0",
    "jaxlib",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
rocm = ["jax[rocm]"]

[project.scripts]
hydride = "hydride.cli:main"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hydride"]

[tool.setuptools.package-data]
hydride = ["*.pickle"]

[dependency-groups]
dev = [
    "jedi>=0.19.2",
    "jedi-language-server>=0.46.0",
    "pytest>=9.0.3",
    "ruff>=0.5.2",
]
